<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Give Board — Admin</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#2C4A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #21322A;
    --forest: #2C4A3E;
    --forest-dark: #1B3129;
    --paper: #FBF8F1;
    --paper-warm: #F3ECD9;
    --gold: #D99A2B;
    --gold-dark: #B87F1E;
    --clay: #C1522E;
    --line: #D8CFB8;
    --muted: #6B6558;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  h1,h2,.display{font-family:'Fraunces',serif;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 6vw;border-bottom:1px solid var(--line);
    background:var(--paper);flex-wrap:wrap;gap:12px;
  }
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .mark{font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem;color:var(--forest);}
  .wordmark .tag{font-size:0.8rem;color:var(--muted);}

  .btn{
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:0.88rem;
    border:none;border-radius:3px;padding:9px 16px;cursor:pointer;
  }
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn-primary{background:var(--forest);color:var(--paper);}
  .btn-primary:hover:not(:disabled){background:var(--forest-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
  .btn-ghost:hover:not(:disabled){background:var(--forest);color:var(--paper);}
  .btn-danger{background:var(--clay);color:var(--paper);}
  .btn-danger:hover:not(:disabled){background:#A6441F;}

  main{padding:36px 6vw 90px;max-width:900px;margin:0 auto;}

  .login-box{max-width:360px;margin:60px auto;background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;padding:28px;}
  .login-box h2{margin:0 0 18px;font-size:1.2rem;}
  .login-box label{display:block;font-size:0.85rem;font-weight:600;margin:14px 0 6px;color:var(--forest);}
  .login-box input{width:100%;border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-family:'Work Sans',sans-serif;font-size:0.95rem;}
  .login-box .err{color:var(--clay);font-size:0.85rem;margin-top:10px;display:none;}
  .login-box .btn{width:100%;margin-top:18px;padding:12px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .toolbar .who{font-size:0.85rem;color:var(--muted);}

  .list{display:flex;flex-direction:column;gap:14px;}
  .row{
    display:flex;gap:16px;background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;
    padding:14px;align-items:flex-start;flex-wrap:wrap;
  }
  .row.is-hidden{opacity:0.6;}
  .row img{width:84px;height:84px;object-fit:contain;background:var(--paper);border-radius:3px;border:1px solid var(--line);background:#eee;flex-shrink:0;}
  .row-body{flex:1;min-width:200px;}
  .row-body h3{margin:0 0 4px;font-size:1.02rem;}
  .row-body .meta{font-size:0.8rem;color:var(--muted);margin-bottom:6px;}
  .row-body .desc{font-size:0.85rem;color:var(--ink);margin-bottom:6px;max-width:520px;}
  .row-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .status-badge{font-size:0.72rem;font-weight:600;padding:3px 9px;border-radius:20px;}
  .status-live{background:#E4EFE6;color:var(--forest-dark);}
  .status-hidden{background:#F3DED2;color:#8A3D1F;}
  .ref-code{font-family:'Fraunces',serif;font-weight:600;font-size:0.85rem;color:var(--forest);}

  .empty{border:1.5px dashed var(--line);border-radius:4px;padding:50px 20px;text-align:center;color:var(--muted);}

  .stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
  .stat-card{background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;padding:16px 20px;min-width:170px;}
  .stat-number{font-family:'Fraunces',serif;font-weight:700;font-size:2rem;color:var(--forest);line-height:1;}
  .stat-label{font-size:0.8rem;color:var(--muted);margin-top:6px;}
  .notify-toggle-card{background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;padding:16px 20px;display:flex;align-items:center;flex:1;min-width:260px;}
  .toggle-label{display:flex;align-items:center;gap:10px;font-size:0.9rem;cursor:pointer;}
  .toggle-label input{width:18px;height:18px;cursor:pointer;flex-shrink:0;}

  .chart-card{background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;padding:16px 20px;margin-bottom:24px;}
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:12px;overflow-x:auto;}
  .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:28px;height:100%;}
  .bar-col .bar-count{font-size:0.68rem;color:var(--muted);margin-bottom:3px;}
  .bar-col .bar{width:100%;max-width:26px;background:var(--forest);border-radius:2px 2px 0 0;min-height:3px;}
  .bar-col .bar-label{font-size:0.68rem;color:var(--muted);margin-top:5px;}

  .notif-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;
    padding:10px 14px;margin-bottom:8px;font-size:0.85rem;
  }
  .notif-item .notif-meta{color:var(--muted);font-size:0.78rem;margin-top:2px;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(27,49,41,0.55);align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay.open{display:flex;}
  .pm-modal{background:var(--paper);border-radius:6px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative;}
  .pm-modal h2{margin:0 30px 14px 0;font-size:1.15rem;}
  .pm-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);}
  .pm-row{display:flex;gap:12px;align-items:center;background:var(--paper-warm);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:10px;flex-wrap:wrap;}
  .pm-row img{width:72px;height:72px;object-fit:contain;background:#eee;border:1px solid var(--line);border-radius:3px;flex-shrink:0;}
  .pm-label{flex:1;min-width:80px;font-size:0.88rem;font-weight:600;}
  .pm-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .pm-btns .btn{padding:6px 10px;font-size:0.8rem;}
  .pm-msg{font-size:0.85rem;font-weight:600;color:var(--forest);margin:10px 0 0;text-align:center;}
  .pm-msg.err{color:var(--clay);}

  .confirm-inline{display:flex;gap:8px;align-items:center;}
  .confirm-inline span{font-size:0.78rem;color:var(--clay);font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <span class="mark">The Give Board</span>
    <span class="tag">— admin</span>
  </div>
  <div id="headerActions"></div>
</header>

<main>
  <div id="loginSection" class="login-box">
    <h2>Admin sign in</h2>
    <label>Email</label>
    <input type="email" id="adminEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="adminPassword" autocomplete="current-password">
    <button class="btn btn-primary" id="signInBtn" onclick="doSignIn()">Sign in</button>
    <div class="err" id="loginErr">Sign-in failed. Check your email and password.</div>
    <p style="margin-top:14px;font-size:.85rem;text-align:center;"><a href="#" onclick="doResetPassword();return false;" style="color:var(--forest);font-weight:600;">Forgot password? Email me a reset link</a></p>
    <div class="err" id="resetMsg" style="color:var(--forest);"></div>
  </div>

  <div id="adminSection" style="display:none;">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="liveItemsCount">—</div>
        <div class="stat-label">Items on board now</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalPostedCount">—</div>
        <div class="stat-label">Items posted (all time)</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalVisitsCount">—</div>
        <div class="stat-label">Site visits (all time)</div>
      </div>
      <div class="notify-toggle-card">
        <label class="toggle-label">
          <input type="checkbox" id="notifyToggle" onchange="toggleNotifySetting()">
          Notify me in-app when someone posts a new item
        </label>
      </div>
    </div>

    <div class="chart-card">
      <div class="stat-label">Visits by month</div>
      <div class="bar-chart" id="visitsChart"></div>
    </div>

    <div id="notificationsSection" style="display:none;">
      <div class="toolbar">
        <h2 style="margin:0;font-size:1.1rem;">New post notifications</h2>
        <button class="btn btn-ghost" id="clearNotifsBtn" onclick="clearAllNotifications()">Clear all</button>
      </div>
      <div id="notificationsList"></div>
    </div>

    <div class="toolbar">
      <h1 style="margin:0;font-size:1.4rem;">All listings</h1>
      <span class="who" id="countLabel"></span>
    </div>
    <div id="optimiseBar" style="display:none;margin-bottom:14px;padding:12px 14px;border:1px solid var(--line, #d9cfbd);border-radius:10px;">
      <div id="optimiseText" style="font-size:.9rem;margin-bottom:8px;"></div>
      <button class="btn btn-ghost" id="optimiseBtn" onclick="optimiseOlderPhotos()">Optimise older photos</button>
    </div>
    <div id="listWrap"></div>
  </div>
</main>

<div class="overlay" id="photoModal">
  <div class="pm-modal">
    <button class="pm-close" onclick="closePhotoManager()" aria-label="Close">&times;</button>
    <h2 id="pmTitle"></h2>
    <div id="pmBody"></div>
    <input type="file" id="adminPhotoInput" accept="image/*" style="display:none">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, getDocs, deleteDoc, updateDoc, orderBy, query, limit,
  Timestamp, serverTimestamp, writeBatch, deleteField
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEnWAqRLRMjcDNj-5_eI5KvjalSrlOf9A",
  authDomain: "give-board.firebaseapp.com",
  projectId: "give-board",
  storageBucket: "give-board.firebasestorage.app",
  messagingSenderId: "1011300803164",
  appId: "1:1011300803164:web:3a6afeeefb531420b17c99"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ADMIN_EMAIL = 'junior@juelltech.com';
let confirmingDeleteId = null;
let rowsById = {};
let recoveryNote = {}; // itemId -> message shown after a recovery link was made

async function doSignIn(){
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('signInBtn');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(e){
    console.error('Sign-in failed', e);
    err.textContent = 'Sign-in failed (' + (e.code || 'unknown error') + '). Check your email and password, or use the reset link below.';
    err.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

async function doResetPassword(){
  const email = document.getElementById('adminEmail').value.trim() || ADMIN_EMAIL;
  const msg = document.getElementById('resetMsg');
  msg.style.color = 'var(--forest)';
  try{
    await sendPasswordResetEmail(auth, email);
    msg.textContent = 'If ' + email + ' is the admin account, a reset link is on its way. Check the inbox and spam folder.';
  }catch(e){
    console.error('Password reset failed', e);
    msg.style.color = 'var(--clay)';
    msg.textContent = 'Could not send the reset email (' + (e.code || 'unknown error') + ').';
  }
  msg.style.display = 'block';
}

async function doSignOut(){
  await signOut(auth);
}

async function loadStats(){
  try{
    const snap = await getDoc(doc(db, 'stats', 'totals'));
    document.getElementById('totalPostedCount').textContent = snap.exists() ? (snap.data().itemsPosted || 0) : 0;
  }catch(e){
    console.error('Failed to load stats', e);
    document.getElementById('totalPostedCount').textContent = '—';
  }
}

async function loadVisitsChart(){
  const chartEl = document.getElementById('visitsChart');
  const totalEl = document.getElementById('totalVisitsCount');
  try{
    const snap = await getDocs(collection(db, 'visits'));
    const months = snap.docs
      .map(d => ({ id: d.id, count: d.data().count || 0 }))
      .sort((a, b) => a.id.localeCompare(b.id));
    const total = months.reduce((sum, m) => sum + m.count, 0);
    totalEl.textContent = total;

    if(months.length === 0){
      chartEl.innerHTML = `<p style="color:var(--muted);font-size:0.85rem;margin:0;">No visits recorded yet.</p>`;
      return;
    }

    const recent = months.slice(-12);
    const max = Math.max(...recent.map(m => m.count), 1);
    chartEl.innerHTML = recent.map(m => {
      const [y, mo] = m.id.split('-');
      const label = new Date(Number(y), Number(mo) - 1, 1).toLocaleDateString(undefined, {month:'short'});
      const heightPct = Math.max(4, Math.round((m.count / max) * 100));
      return `
        <div class="bar-col" title="${m.id}: ${m.count} visit${m.count === 1 ? '' : 's'}">
          <div class="bar-count">${m.count}</div>
          <div class="bar" style="height:${heightPct}%;"></div>
          <div class="bar-label">${label}</div>
        </div>`;
    }).join('');
  }catch(e){
    console.error('Failed to load visits chart', e);
    totalEl.textContent = '—';
    chartEl.innerHTML = `<p style="color:var(--muted);font-size:0.85rem;margin:0;">Couldn't load visit data.</p>`;
  }
}

async function loadNotifySetting(){
  try{
    const snap = await getDoc(doc(db, 'settings', 'notifications'));
    document.getElementById('notifyToggle').checked = snap.exists() && !!snap.data().enabled;
  }catch(e){
    console.error('Failed to load notification setting', e);
  }
}

async function toggleNotifySetting(){
  const checked = document.getElementById('notifyToggle').checked;
  try{
    await setDoc(doc(db, 'settings', 'notifications'), { enabled: checked }, { merge: true });
  }catch(e){
    console.error('Failed to update notification setting', e);
  }
  if(checked) loadNotifications();
}

async function loadNotifications(){
  const section = document.getElementById('notificationsSection');
  const list = document.getElementById('notificationsList');
  try{
    const snap = await getDocs(query(collection(db, 'notifications'), orderBy('postedAt', 'desc'), limit(50)));
    if(snap.empty){
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    list.innerHTML = snap.docs.map(d => {
      const n = d.data();
      const when = n.postedAt ? n.postedAt.toDate().toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'just now';
      return `
        <div class="notif-item">
          <div>
            <div>New listing: <strong>${escapeHtml(n.title)}</strong></div>
            <div class="notif-meta">${escapeHtml(n.reference)} · ${when}</div>
          </div>
          <button class="btn btn-ghost" onclick="window.__adminDismissNotification('${d.id}')">Dismiss</button>
        </div>`;
    }).join('');
  }catch(e){
    console.error('Failed to load notifications', e);
    section.style.display = 'none';
  }
}

async function dismissNotification(notifId){
  try{
    await deleteDoc(doc(db, 'notifications', notifId));
    loadNotifications();
  }catch(e){
    console.error('Failed to dismiss notification', e);
  }
}

async function clearAllNotifications(){
  const btn = document.getElementById('clearNotifsBtn');
  btn.disabled = true;
  try{
    const snap = await getDocs(collection(db, 'notifications'));
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    await loadNotifications();
  }catch(e){
    console.error('Failed to clear notifications', e);
  }finally{
    btn.disabled = false;
  }
}

async function loadAllListings(){
  const listWrap = document.getElementById('listWrap');
  const countLabel = document.getElementById('countLabel');
  listWrap.innerHTML = `<p style="color:var(--muted);">Loading…</p>`;

  const snap = await getDocs(query(collection(db, 'items'), orderBy('postedAt', 'desc')));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  countLabel.textContent = items.length === 1 ? '1 listing' : items.length + ' listings';
  document.getElementById('liveItemsCount').textContent = items.filter(it => !it.hidden).length;

  if(items.length === 0){
    listWrap.innerHTML = `<div class="empty">No listings yet.</div>`;
    return;
  }

  const contacts = {};
  let contactsFailed = false;
  try{
    const contactsSnap = await getDocs(collection(db, 'ownerContacts'));
    contactsSnap.docs.forEach(d => { contacts[d.id] = d.data().email; });
  }catch(e){
    console.error('Failed to load poster emails', e);
    contactsFailed = true;
  }

  const rows = await Promise.all(items.map(async it => {
    const msgsSnap = await getDocs(collection(db, 'items', it.id, 'messages'));
    return { ...it, msgCount: msgsSnap.size, email: contacts[it.id] || null };
  }));
  rowsById = Object.fromEntries(rows.map(r => [r.id, r]));
  if(contactsFailed){
    countLabel.textContent += ' · could not read poster emails (check you are signed in as the admin)';
  }

  renderRows(rows);
  updateOptimiseBar();
}

/* ---- one-off tidy-up of listings posted before thumbnails existed ---- */
const OPT_MAX_DIM = 800;               // same limits the public site applies to new photos
const OPT_TARGET_CHARS = 200 * 1024;
const OPT_THUMB_DIM = 400;

function olderListings(){
  return Object.values(rowsById).filter(r => r.image && !r.thumb);
}

function updateOptimiseBar(message){
  const old = olderListings();
  const bar = document.getElementById('optimiseBar');
  const text = document.getElementById('optimiseText');
  bar.style.display = (old.length || message) ? 'block' : 'none';
  document.getElementById('optimiseBtn').style.display = old.length ? 'inline-block' : 'none';
  if(message){
    text.textContent = message;
  }else if(old.length){
    const kb = Math.round(old.reduce((n, r) => n + r.image.length, 0) / 1024);
    text.textContent = old.length + ' older listing' + (old.length === 1 ? '' : 's') +
      ' still use a single full-size photo (' + kb + ' KB). Optimise gives each one a small thumbnail for the board and a resized photo, like new listings.';
  }
}

function loadImg(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function drawScaled(img, maxDim){
  const canvas = document.createElement('canvas');
  const scale = Math.min(1, maxDim / img.width, maxDim / img.height); // resize only, never crop
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; // JPEG has no transparency
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas;
}

async function shrinkOlderPhoto(original){
  const img = await loadImg(original);
  const canvas = drawScaled(img, OPT_MAX_DIM);
  let photo = '';
  for(const quality of [0.72, 0.62, 0.52, 0.42, 0.32]){
    photo = canvas.toDataURL('image/jpeg', quality);
    if(photo.length <= OPT_TARGET_CHARS) break;
  }
  if(photo.length >= original.length) photo = original; // already smaller than we can make it
  const thumb = drawScaled(img, OPT_THUMB_DIM).toDataURL('image/jpeg', 0.6);
  return { photo, thumb };
}

/* ---- photo manager: the admin can add, remove and choose the main photo of any listing ---- */
const ADMIN_PHOTO_IDS = ['p1', 'p2', 'p3', 'p4'];
let photoModalId = null;
let photoModalPhotos = [];
let photoModalBusy = false;

function olderFormat(it){
  return !!(it.image && !it.thumb);
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function thumbFromPhoto(dataUrl){
  const img = await loadImg(dataUrl);
  return drawScaled(img, OPT_THUMB_DIM).toDataURL('image/jpeg', 0.6);
}

async function openPhotoManager(itemId){
  photoModalId = itemId;
  document.getElementById('pmTitle').textContent = rowsById[itemId].title;
  document.getElementById('photoModal').classList.add('open');
  await refreshPhotoManager();
}

function closePhotoManager(){
  document.getElementById('photoModal').classList.remove('open');
  photoModalId = null;
}

async function refreshPhotoManager(message, isError){
  const body = document.getElementById('pmBody');
  const it = rowsById[photoModalId];
  if(!it) return;
  body.innerHTML = `<p style="color:var(--muted);">Loading photos…</p>`;
  try{
    const snap = await getDocs(collection(db, 'items', photoModalId, 'photos'));
    photoModalPhotos = snap.docs.map(d => ({ id: d.id, data: d.data().data })).sort((a, b) => a.id.localeCompare(b.id));
  }catch(e){
    console.error('Failed to load photos', e);
    body.innerHTML = `<p class="pm-msg err">Could not load the photos.</p>`;
    return;
  }
  const rows = photoModalPhotos.map((p, i) => {
    const isMain = p.id === it.mainPhoto;
    return `
      <div class="pm-row">
        <img src="${p.data}" alt="Photo ${i + 1}">
        <div class="pm-label">${isMain ? 'Main photo' : 'Photo ' + (i + 1)}</div>
        <div class="pm-btns">
          ${isMain ? '' : `<button class="btn btn-ghost" onclick="window.__pmMakeMain('${p.id}')">Make main</button>`}
          ${photoModalPhotos.length > 1 ? `<button class="btn btn-danger" onclick="window.__pmRemove('${p.id}')">Remove</button>` : ''}
        </div>
      </div>`;
  }).join('');
  const full = photoModalPhotos.length >= ADMIN_PHOTO_IDS.length;
  body.innerHTML = rows +
    `<button class="btn btn-ghost" style="width:100%;" ${full ? 'disabled' : ''} onclick="document.getElementById('adminPhotoInput').click()">${full ? 'Already has 4 photos' : 'Add a photo'}</button>` +
    (message ? `<p class="pm-msg${isError ? ' err' : ''}">${escapeHtml(message)}</p>` : '');
}

// Runs one change, then refreshes the listings behind the modal and the modal itself
async function runPhotoChange(change, doneMessage){
  if(photoModalBusy || !photoModalId) return;
  photoModalBusy = true;
  try{
    await change();
    await loadAllListings();
    await refreshPhotoManager(doneMessage);
  }catch(e){
    console.error('Photo change failed', e);
    await refreshPhotoManager('Something went wrong. Please try again.', true);
  }finally{
    photoModalBusy = false;
  }
}

function makeMainPhoto(photoId){
  runPhotoChange(async () => {
    const photo = photoModalPhotos.find(p => p.id === photoId);
    const thumb = await thumbFromPhoto(photo.data);
    await updateDoc(doc(db, 'items', photoModalId), { mainPhoto: photoId, thumb });
  }, 'Main photo changed.');
}

function removePhoto(photoId){
  if(!confirm('Remove this photo from the listing?')) return;
  runPhotoChange(async () => {
    const remaining = photoModalPhotos.filter(p => p.id !== photoId);
    if(!remaining.length) throw new Error('A listing needs at least one photo');
    const updates = { photoCount: remaining.length };
    if(photoId === rowsById[photoModalId].mainPhoto){
      updates.mainPhoto = remaining[0].id;
      updates.thumb = await thumbFromPhoto(remaining[0].data);
    }
    const batch = writeBatch(db);
    batch.delete(doc(db, 'items', photoModalId, 'photos', photoId));
    batch.update(doc(db, 'items', photoModalId), updates);
    await batch.commit();
  }, 'Photo removed.');
}

document.getElementById('adminPhotoInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  runPhotoChange(async () => {
    const img = await loadImg(await readFileAsDataUrl(file));
    const canvas = drawScaled(img, OPT_MAX_DIM); // resize only, never crop
    let photo = '';
    for(const quality of [0.72, 0.62, 0.52, 0.42, 0.32]){
      photo = canvas.toDataURL('image/jpeg', quality);
      if(photo.length <= OPT_TARGET_CHARS) break;
    }
    if(photo.length > 700000) throw new Error('Photo still too large after compression');
    const freeId = ADMIN_PHOTO_IDS.find(id => !photoModalPhotos.some(p => p.id === id));
    if(!freeId) throw new Error('No free photo slot');
    const batch = writeBatch(db);
    batch.set(doc(db, 'items', photoModalId, 'photos', freeId), { data: photo });
    batch.update(doc(db, 'items', photoModalId), { photoCount: photoModalPhotos.length + 1 });
    await batch.commit();
  }, 'Photo added.');
});

async function optimiseOlderPhotos(){
  const old = olderListings();
  if(!old.length) return;
  const btn = document.getElementById('optimiseBtn');
  btn.disabled = true;
  let done = 0, before = 0, after = 0, failed = 0;
  for(const r of old){
    btn.textContent = 'Optimising ' + (done + failed + 1) + ' of ' + old.length + '…';
    try{
      const { photo, thumb } = await shrinkOlderPhoto(r.image);
      // One batch, so a listing never ends up without its photo
      const batch = writeBatch(db);
      batch.set(doc(db, 'items', r.id, 'photos', 'p1'), { data: photo });
      batch.update(doc(db, 'items', r.id), { thumb, mainPhoto: 'p1', photoCount: 1, image: deleteField() });
      await batch.commit();
      before += r.image.length;
      after += photo.length + thumb.length;
      done++;
    }catch(e){
      console.error('Failed to optimise listing ' + r.id, e);
      failed++;
    }
  }
  btn.disabled = false;
  btn.textContent = 'Optimise older photos';
  await loadAllListings();
  updateOptimiseBar('Optimised ' + done + ' listing' + (done === 1 ? '' : 's') + ': ' +
    Math.round(before / 1024) + ' KB before, ' + Math.round(after / 1024) + ' KB after (including thumbnails).' +
    (failed ? ' ' + failed + ' could not be changed; try again.' : ''));
}

function renderRows(rows){
  const listWrap = document.getElementById('listWrap');
  listWrap.innerHTML = `<div class="list">` + rows.map(it => {
    const date = it.postedAt ? it.postedAt.toDate().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : 'just now';
    const hidden = !!it.hidden;
    const deleting = confirmingDeleteId === it.id;
    return `
      <div class="row ${hidden ? 'is-hidden' : ''}" data-id="${it.id}">
        <img src="${it.thumb || it.image}" alt="${escapeHtml(it.title)}">
        <div class="row-body">
          <h3>${escapeHtml(it.title)}</h3>
          <div class="meta">
            Posted ${date} · ${escapeHtml(it.condition || '')} ·
            ${it.msgCount} message${it.msgCount === 1 ? '' : 's'} ·
            <span class="ref-code">${escapeHtml(it.reference)}</span>
          </div>
          <div class="desc">${escapeHtml(it.description)}</div>
          <div class="meta" style="margin-bottom:8px;">${it.email
            ? 'Poster email (private): <strong>' + escapeHtml(it.email) + '</strong>'
            : 'No poster email on file (posted before emails were kept)'}</div>
          <div class="meta" style="margin-bottom:8px;">Photos: ${it.image && !it.thumb ? '1 (older format)' : (it.photoCount || 1)} of 4</div>
          ${recoveryNote[it.id] ? `<div class="meta" style="color:var(--forest);font-weight:600;margin-bottom:8px;">${escapeHtml(recoveryNote[it.id])}</div>` : ''}
          <span class="status-badge ${hidden ? 'status-hidden' : 'status-live'}">${hidden ? 'Hidden' : 'Live on board'}</span>
        </div>
        <div class="row-actions">
          ${deleting ? `
            <div class="confirm-inline">
              <span>Delete permanently?</span>
              <button class="btn btn-ghost" onclick="window.__adminCancelDelete()">Cancel</button>
              <button class="btn btn-danger" onclick="window.__adminConfirmDelete('${it.id}')">Confirm</button>
            </div>
          ` : `
            <button class="btn btn-ghost" ${olderFormat(it) ? 'disabled title="Use Optimise older photos first"' : ''} onclick="window.__adminManagePhotos('${it.id}')">Manage photos</button>
            <button class="btn btn-ghost" ${it.email ? '' : 'disabled title="No email on file for this listing"'} onclick="window.__adminSendRecovery('${it.id}')">Send recovery link</button>
            <button class="btn btn-ghost" onclick="window.__adminToggleHidden('${it.id}', ${hidden})">${hidden ? 'Unhide' : 'Hide'}</button>
            <button class="btn btn-danger" onclick="window.__adminStartDelete('${it.id}')">Delete permanently</button>
          `}
        </div>
      </div>`;
  }).join('') + `</div>`;
}

function makeToken(){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

async function sendRecovery(itemId){
  const row = rowsById[itemId];
  if(!row || !row.email) return;
  try{
    const token = makeToken();
    const expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
    // setDoc replaces any earlier token, so a new link always supersedes an old one
    await setDoc(doc(db, 'recovery', itemId), {
      token, expiresAt: Timestamp.fromDate(expires), createdAt: serverTimestamp()
    });

    const link = location.origin + '/?recover=' + encodeURIComponent(itemId) + '.' + token;
    const subject = encodeURIComponent('Your Give Board listing: ' + row.title);
    const body = encodeURIComponent(
      'Hi,\n\nYou asked us for help getting back into your Give Board listing "' + row.title + '".\n\n' +
      'Your reference code (for messages and removing the listing): ' + row.reference + '\n\n' +
      'To edit the photos from the device you\'re on now, open this link on that device and tap "Restore access". ' +
      'It works once and expires in 7 days:\n' + link + '\n\n' +
      'If you didn\'t ask for this, you can ignore this email.\n\nThe Give Board'
    );
    try{ await navigator.clipboard.writeText(link); }catch(e){ /* clipboard is a convenience only */ }
    recoveryNote[itemId] = 'Recovery link created (valid 7 days) and copied to your clipboard. Your email app should open addressed to the poster.';
    renderRows(Object.values(rowsById));
    window.location.href = 'mailto:' + encodeURIComponent(row.email) + '?subject=' + subject + '&body=' + body;
  }catch(e){
    console.error('Failed to create recovery link', e);
    recoveryNote[itemId] = 'Could not create the recovery link. Check you are signed in and the rules are published.';
    renderRows(Object.values(rowsById));
  }
}

async function toggleHidden(itemId, currentlyHidden){
  try{
    await updateDoc(doc(db, 'items', itemId), { hidden: !currentlyHidden });
    await loadAllListings();
  }catch(e){
    console.error('Failed to toggle listing visibility', e);
  }
}

function startDelete(itemId){
  confirmingDeleteId = itemId;
  loadAllListings();
}
function cancelDelete(){
  confirmingDeleteId = null;
  loadAllListings();
}
async function confirmDelete(itemId){
  try{
    const msgsSnap = await getDocs(collection(db, 'items', itemId, 'messages'));
    await Promise.all(msgsSnap.docs.map(m => deleteDoc(m.ref)));
    const photosSnap = await getDocs(collection(db, 'items', itemId, 'photos'));
    await Promise.all(photosSnap.docs.map(ph => deleteDoc(ph.ref)));
    await deleteDoc(doc(db, 'ownerContacts', itemId));
    await deleteDoc(doc(db, 'recovery', itemId));
    await deleteDoc(doc(db, 'items', itemId));
    confirmingDeleteId = null;
    await loadAllListings();
  }catch(e){
    console.error('Failed to delete listing', e);
  }
}

onAuthStateChanged(auth, user => {
  const loginSection = document.getElementById('loginSection');
  const adminSection = document.getElementById('adminSection');
  const headerActions = document.getElementById('headerActions');
  // The site also signs visitors in anonymously (to give posters edit rights), so a signed-in
  // user is not necessarily the admin.
  if(user && (user.email || '').toLowerCase() !== ADMIN_EMAIL){
    signOut(auth);
    // An anonymous session is expected here; only explain a real account that isn't the admin.
    if(!user.isAnonymous){
      const err = document.getElementById('loginErr');
      err.textContent = 'Signed in as ' + user.email + ', which is not the admin account (' + ADMIN_EMAIL + ').';
      err.style.display = 'block';
    }
    return;
  }
  if(user){
    loginSection.style.display = 'none';
    adminSection.style.display = 'block';
    headerActions.innerHTML = `<button class="btn btn-ghost" onclick="window.__adminSignOut()">Sign out</button>`;
    confirmingDeleteId = null;
    loadAllListings();
    loadStats();
    loadVisitsChart();
    loadNotifySetting();
    loadNotifications();
  }else{
    loginSection.style.display = 'block';
    adminSection.style.display = 'none';
    headerActions.innerHTML = '';
  }
});
